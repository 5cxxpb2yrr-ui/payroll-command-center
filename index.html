<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Payroll Command Center (Alpine)</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg: #050506;
            --card: #0f0f10;
            --muted: #9aa0a6;
            --accent: #00c2a8;
            --danger: #ff6b6b;
            --success: #2dd4bf;
            --gap: 12px;
            --tab-height: 64px;
        }
        html, body { height: 100%; background: var(--bg); margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; padding-bottom: calc(var(--tab-height) + env(safe-area-inset-bottom)); }
        .app { max-width: 980px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 12px 12px; display: flex; flex-direction: column; gap: var(--gap); }
        .card { background: var(--card); border-radius: 12px; padding: 12px; }
        .summary-bar { display: flex; justify-content: space-between; gap: 12px; }
        .summary-kpis { display: flex; gap: 8px; margin-top: 8px; }
        .kpi { background: rgba(255,255,255,0.02); padding: 8px 10px; border-radius: 8px; min-width: 110px; }
        .kpi b { display: block; font-size: 1.05rem; margin-top: 2px; }
        .pill { padding: 6px 10px; border-radius: 999px; background: #121214; color: var(--muted); font-size: 13px; }
        .muted { color: var(--muted); }
        .small { font-size: 13px; }
        .ghost { background: transparent; border: 1px solid rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 8px; color: var(--muted); font-size: 13px; }
        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab { padding: 8px 14px; border-radius: 8px; color: var(--muted); font-weight: 600; cursor: pointer; }
        .tab.active { background: #121214; color: #fff; }
        .tc-row { display: flex; gap: 8px; align-items: center; padding: 10px 8px; border-radius: 8px; margin-bottom: 8px; background: rgba(255,255,255,0.01); }
        .tc-date { width: 110px; }
        .tc-inputs { display: flex; gap: 8px; flex: 1; justify-content: flex-end; }
        .tc-select { background: #0b0b0c; border: 1px solid #1a1a1b; color: #fff; padding: 8px; border-radius: 8px; }
        .math-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); font-size: 13px; }
        .bottom-tabs { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tab-height); display: flex; justify-content: space-around; align-items: center; background: #060607; border-top: 1px solid rgba(255,255,255,0.06); padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; flex: 1; cursor: pointer; }
        .tab-btn.active { color: #fff; }
    </style>
</head>
<body>
    <div class="app" x-data="{
        tab: 'time',
        baseRate: 41.64,
        days: [
            { date: 'Mon 6/1', reg: 12, ot: 0 },
            { date: 'Tue 6/2', reg: 12, ot: 0 },
            { date: 'Wed 6/3', reg: 12, ot: 0 },
            { date: 'Thu 6/4', reg: 12, ot: 0 },
            { date: 'Fri 6/5', reg: 12, ot: 0 },
            { date: 'Sat 6/6', reg: 0, ot: 0 },
            { date: 'Sun 6/7', reg: 0, ot: 0 }
        ],
        get gross() {
            return this.days.reduce((sum, d) => sum + (Number(d.reg) * this.baseRate) + (Number(d.ot) * this.baseRate * 1.5), 0);
        },
        get stateTax() { return this.gross * 0.0499; },
        get net() { return this.gross - this.stateTax; }
    }">
        <div class="summary-bar card">
            <div>
                <div style="font-weight:800; font-size:1.1rem;">June 2026</div>
                <div class="summary-kpis">
                    <div class="kpi"><small class="muted small">Projected Gross</small><b x-text="'$' + gross.toFixed(2)">$0.00</b></div>
                    <div class="kpi"><small class="muted small">Est Net Pay</small><b x-text="'$' + net.toFixed(2)" style="color:var(--success)">$0.00</b></div>
                </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px">
                <div class="pill small">Pay Period Fixed Frame</div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab" :class="tab === 'time' ? 'active' : ''" @click="tab = 'time'">Timecard</div>
                <div class="tab" :class="tab === 'tax' ? 'active' : ''" @click="tab = 'tax'">Taxes</div>
            </div>

            <div x-show="tab === 'time'">
                <template x-for="(day, index) in days" :key="index">
                    <div class="tc-row">
                        <div class="tc-date"><div style="font-weight:700" x-text="day.date"></div></div>
                        <div class="tc-inputs">
                            <div>
                                <label class="small muted">Reg</label>
                                <select class="tc-select" x-model="day.reg">
                                    <template x-for="h in [0,4,6,8,10,12]">
                                        <option :value="h" x-text="h"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="small muted" style="color:var(--danger)">OT</label>
                                <select class="tc-select" style="color:var(--danger)" x-model="day.ot">
                                    <template x-for="h in [0,2,4,6,8]">
                                        <option :value="h" x-text="h"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="tab === 'tax'">
                <div class="card">
                    <div class="math-line"><span>Taxable Gross</span><span x-text="'$' + gross.toFixed(2)"></span></div>
                    <div class="math-line"><span>GA State Tax (4.99%)</span><span x-text="'$' + stateTax.toFixed(2)"></span></div>
                    <div class="math-line" style="font-weight:700;"><span>Total Taxes</span><span x-text="'$' + stateTax.toFixed(2)"></span></div>
                </div>
            </div>
        </div>

        <div class="bottom-tabs">
            <div class="tab-btn" :class="tab === 'time' ? 'active' : ''" @click="tab = 'time'"><span>⏱</span><span>Time</span></div>
            <div class="tab-btn" :class="tab === 'tax' ? 'active' : ''" @click="tab = 'tax'"><span>💸</span><span>Tax</span></div>
        </div>
    </div>
</body>
</html>

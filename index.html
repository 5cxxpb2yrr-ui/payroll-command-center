<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Payroll Command Center</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg: #050506;
            --card: #0f0f10;
            --muted: #9aa0a6;
            --accent: #00c2a8;
            --danger: #ff6b6b;
            --success: #2dd4bf;
            --gap: 12px;
            --tab-height: 64px;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            background: var(--bg);
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            padding-bottom: calc(var(--tab-height) + env(safe-area-inset-bottom));
        }
        .app {
            max-width: 980px;
            margin: 0 auto;
            padding: calc(env(safe-area-inset-top) + 12px) 12px 12px;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .summary-bar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }
        .summary-left { flex: 1; }
        .month-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .month-label {
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px 8px;
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.05); }
        .summary-kpis {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .kpi {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
            padding: 8px 10px;
            border-radius: 8px;
            min-width: 110px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .kpi small {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 2px;
        }
        .kpi b {
            display: block;
            font-size: 1.05rem;
            color: #fff;
        }
        .pill {
            padding: 6px 10px;
            border-radius: 999px;
            background: #121214;
            color: var(--muted);
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .muted { color: var(--muted); }
        .small { font-size: 13px; }
        .ghost {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--muted);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ghost:hover { background: rgba(255,255,255,0.05); }
        .save-btn {
            background: var(--accent);
            color: #02120f;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        .save-btn:hover { opacity: 0.95; }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 14px;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover { color: #fff; }
        .tab.active {
            background: #121214;
            color: #fff;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
        }
        .tc-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.02);
            flex-wrap: wrap;
        }
        .tc-date {
            width: 110px;
            min-width: 110px;
        }
        .tc-date div:first-child { font-weight: 700; color: #fff; }
        .tc-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
            flex-wrap: wrap;
            min-width: 300px;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tc-select, .input-num {
            background: #0b0b0c;
            border: 1px solid #1a1a1b;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
        }
        .tc-select { min-width: 72px; text-align: right; }
        .input-num { width: 100px; text-align: right; }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .cal-cell {
            background: #0b0b0c;
            padding: 8px;
            border-radius: 8px;
            min-height: 56px;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.02);
            display: flex;
            flex-direction: column;
        }
        .cal-cell:hover { background: #121214; }
        .cal-cell.header {
            opacity: 0.6;
            font-weight: 700;
            text-align: center;
            min-height: unset;
            cursor: default;
            background: transparent;
            border: none;
        }
        .cal-cell .num { font-weight: 700; color: #fff; }
        .cal-cell .gross { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
        .cal-tags { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
        .cal-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            background: #2b2b2c;
        }
        .cal-tag.coverage { background: #1b2b1b; color: var(--success); }
        .math-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.06);
            font-size: 13px;
            color: #fff;
        }
        .math-line.total { font-weight: 700; border-bottom: none; }
        .deduction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
        }
        .bottom-tabs {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--tab-height);
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(180deg, rgba(6,6,7,0.85), rgba(6,6,7,0.98));
            z-index: 50;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--muted);
            font-size: 11px;
            flex: 1;
            padding: 6px 0;
            cursor: pointer;
            transition: color 0.2s;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: #fff; }
        .fab {
            position: fixed;
            right: 16px;
            bottom: calc(var(--tab-height) + env(safe-area-inset-bottom) + 16px);
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(180deg, var(--accent), #00a88f);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 60;
            cursor: pointer;
            border: none;
        }
        .fab svg { width: 22px; height: 22px; fill: #02120f; }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 320px;
            transform: translateX(-110%);
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
            z-index: 70;
            padding: 12px;
            background: #050506;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            overflow-y: auto;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 65;
            pointer-events: none;
        }
        .sidebar-backdrop.show { opacity: 1; pointer-events: auto; }
        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #0f0f10, #0b0b0c);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 16px;
            transform: translateY(110%);
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
            z-index: 80;
            max-height: 92%;
            overflow: auto;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .sheet.open { transform: translateY(0); }
        h3 { margin: 0 0 12px 0; font-size: 1rem; color: #fff; }
        h4 { margin: 0 0 8px 0; color: #fff; }
        [x-cloak] { display: none; }
    </style>
</head>
<body>
    <div class="app" x-data="payrollApp()" x-cloak>
        <div class="summary-bar card">
            <div class="summary-left">
                <div class="month-nav">
                    <div class="month-label" x-text="monthLabel"></div>
                    <button class="nav-btn" @click="prevMonth()">◀</button>
                    <button class="nav-btn" @click="nextMonth()">▶</button>
                </div>
                <div class="summary-kpis">
                    <div class="kpi">
                        <small>Projected Gross</small>
                        <b x-text="'$' + payroll.earnings.toFixed(2)"></b>
                    </div>
                    <div class="kpi">
                        <small>Est Net Pay</small>
                        <b style="color:var(--success)" x-text="'$' + payroll.net.toFixed(2)"></b>
                    </div>
                    <div class="kpi">
                        <small>Planned Leave</small>
                        <b style="color:var(--accent)" x-text="leaveHours + 'h'"></b>
                    </div>
                </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
                <div class="pill small" x-text="'Pay Period: ' + periodLabel"></div>
                <div style="display:flex;gap:8px">
                    <button class="ghost" @click="calculatePayroll()">Recompute</button>
                    <button class="save-btn">Preview Export</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab" :class="tab === 'time' && 'active'" @click="tab = 'time'">Timecard</div>
                <div class="tab" :class="tab === 'calendar' && 'active'" @click="tab = 'calendar'">Calendar</div>
                <div class="tab" :class="tab === 'deductions' && 'active'" @click="tab = 'deductions'">Deductions</div>
                <div class="tab" :class="tab === 'tax' && 'active'" @click="tab = 'tax'">Taxes</div>
                <div class="tab" :class="tab === 'debug' && 'active'" @click="tab = 'debug'">Debug</div>
            </div>

            <template x-if="tab === 'time'">
                <div>
                    <template x-for="(day, idx) in timecardDays" :key="day.iso">
                        <div class="tc-row">
                            <div class="tc-date">
                                <div x-text="day.label + ' ' + day.dateShort"></div>
                                <div class="muted small" x-text="day.isDefaultWorkDay ? 'Scheduled Shift' : 'Off'"></div>
                            </div>
                            <div class="tc-inputs">
                                <template x-if="day.label !== 'Sun'">
                                    <div class="input-group">
                                        <input type="checkbox" x-model="day.eptoChecked" @change="calculatePayroll()" />
                                        <label class="small muted">EPTO</label>
                                    </div>
                                </template>
                                <template x-if="day.label !== 'Sun'">
                                    <div class="input-group">
                                        <label class="small muted">Reg</label>
                                        <select class="tc-select" x-model.number="day.reg" @change="calculatePayroll()">
                                            <template x-for="h in [0,4,6,8,10,12]">
                                                <option :value="h" x-text="h"></option>
                                            </template>
                                        </select>
                                    </div>
                                </template>
                                <template x-if="day.label !== 'Sun'">
                                    <div class="input-group">
                                        <label class="small muted" style="color:var(--danger)">OT</label>
                                        <select class="tc-select" style="color:var(--danger)" x-model.number="day.ot" @change="calculatePayroll()">
                                            <template x-for="h in [0,2,4,6,8]">
                                                <option :value="h" x-text="h"></option>
                                            </template>
                                        </select>
                                    </div>
                                </template>
                                <template x-if="day.label === 'Sun'">
                                    <div class="input-group">
                                        <label class="small muted" style="color:var(--accent)">DT</label>
                                        <select class="tc-select" style="color:var(--accent)" x-model.number="day.dt" @change="calculatePayroll()">
                                            <template x-for="h in [0,2,4,6,8,10]">
                                                <option :value="h" x-text="h"></option>
                                            </template>
                                        </select>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
                        <button class="ghost" @click="autoFillFromCalendar()">Auto Fill From Calendar</button>
                        <button class="ghost" @click="clearTimecard()">Clear Timecard</button>
                        <div style="flex:1"></div>
                        <button class="save-btn" @click="calculatePayroll()">Save & Recompute</button>
                    </div>
                </div>
            </template>

            <template x-if="tab === 'calendar'">
                <div class="cal-grid">
                    <template x-for="day in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']">
                        <div class="cal-cell header" x-text="day"></div>
                    </template>
                    <template x-for="blank in calendarBlanks">
                        <div class="cal-cell" style="background:transparent;border:none;"></div>
                    </template>
                    <template x-for="day in calendarDays">
                        <div class="cal-cell" @click="openDaySheet(day)">
                            <div style="display:flex;justify-content:space-between;align-items:center">
                                <div class="num" x-text="day.dayNum"></div>
                                <div class="gross" x-text="'$' + day.estGross.toFixed(0)"></div>
                            </div>
                            <div class="cal-tags">
                                <template x-if="day.leaveType">
                                    <div class="cal-tag" x-text="day.leaveType"></div>
                                </template>
                                <template x-if="day.shiftCoverage">
                                    <div class="cal-tag coverage">Cov</div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template x-if="tab === 'deductions'">
                <div>
                    <div class="card">
                        <h3>Pre-Tax Deductions</h3>
                        <template x-for="(label, key) in { med: 'Medical Plan Premium', dental: 'Dental Premium', k401: 'Pre-Tax 401(k)' }">
                            <div class="deduction-item">
                                <div x-text="label"></div>
                                <div style="display:flex;align-items:center;gap:6px">
                                    <span class="muted small">$</span>
                                    <input class="input-num" type="number" step="0.01" x-model.number="preTax[key]" @change="calculatePayroll()" />
                                </div>
                            </div>
                        </template>
                        <div class="deduction-item" style="margin-top:12px; border-top:1px dashed rgba(255,255,255,0.08); padding-top:8px;">
                            <div class="muted small">Total Pre-Tax</div>
                            <div style="color:var(--danger); font-weight:700;" x-text="'$' + preTaxTotal.toFixed(2)"></div>
                        </div>
                    </div>
                    <div class="card" style="margin-top:12px">
                        <h3>Post-Tax Deductions</h3>
                        <template x-for="(label, key) in { roth: 'Roth 401(k) Contribution' }">
                            <div class="deduction-item">
                                <div x-text="label"></div>
                                <div style="display:flex;align-items:center;gap:6px">
                                    <span class="muted small">$</span>
                                    <input class="input-num" type="number" step="0.01" x-model.number="postTax[key]" @change="calculatePayroll()" />
                                </div>
                            </div>
                        </template>
                        <div class="deduction-item" style="margin-top:12px; border-top:1px dashed rgba(255,255,255,0.08); padding-top:8px;">
                            <div class="muted small">Total Post-Tax</div>
                            <div style="color:var(--danger); font-weight:700;" x-text="'$' + postTaxTotal.toFixed(2)"></div>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="tab === 'tax'">
                <div>
                    <div class="card">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                            <div>
                                <b>Federal Withholding</b>
                                <div class="muted small">Simple 8.2% baseline toggle</div>
                            </div>
                            <input type="checkbox" x-model="enableFedWithholding" @change="calculatePayroll()" />
                        </div>
                    </div>
                    <div class="card" style="margin-top:12px">
                        <h3>Tax Rolldown</h3>
                        <div class="math-line">
                            <span>Taxable Gross</span>
                            <span x-text="'$' + payroll.taxableGross.toFixed(2)"></span>
                        </div>
                        <div class="math-line">
                            <span>Federal Withholding</span>
                            <span x-text="'$' + payroll.taxes.federal.toFixed(2)"></span>
                        </div>
                        <div class="math-line">
                            <span>Social Security (6.2%)</span>
                            <span x-text="'$' + payroll.taxes.ss.toFixed(2)"></span>
                        </div>
                        <div class="math-line">
                            <span>Medicare (1.45%)</span>
                            <span x-text="'$' + payroll.taxes.med.toFixed(2)"></span>
                        </div>
                        <div class="math-line">
                            <span>GA State Tax (4.99%)</span>
                            <span x-text="'$' + payroll.taxes.state.toFixed(2)"></span>
                        </div>
                        <div class="math-line total">
                            <span>Total Taxes</span>
                            <span x-text="'$' + payroll.taxesTotal.toFixed(2)"></span>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="tab === 'debug'">
                <div class="card">
                    <h3>Engine Architecture State</h3>
                    <pre style="white-space:pre-wrap;font-family:monospace;font-size:11px; background:#050506; padding:8px; border-radius:6px; color:#a2b6cb; margin: 0;max-height: 400px; overflow: auto;" x-text="JSON.stringify({timecardDays, preTax, postTax, baseRate, incentiveAmt, scheduledLeaveLog}, null, 2)"></pre>
                </div>
            </template>
        </div>

        <button class="fab" @click="sidebarOpen = !sidebarOpen">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" /></svg>
        </button>

        <div class="sidebar" :class="sidebarOpen && 'open'">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <b>Pay Period Navigator</b>
                        <div class="muted small">Shift tracking target windows</div>
                    </div>
                    <button class="ghost" @click="sidebarOpen = false">Close</button>
                </div>
                <div style="margin-top:12px">
                    <div style="margin-bottom:12px">
                        <div class="muted small">Active Frame</div>
                        <div><b x-text="periodLabel"></b></div>
                    </div>
                    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
                        <input type="date" class="input-num" style="width:140px" x-model="startDateInput" />
                        <button class="ghost" @click="applyStart()">Apply</button>
                    </div>
                    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
                        <button class="ghost" style="font-size:12px;padding:6px 10px" @click="setToThisMonth()">Start of Month</button>
                        <button class="ghost" style="font-size:12px;padding:6px 10px" @click="setToPrevPeriod()">Prev Period</button>
                        <button class="ghost" style="font-size:12px;padding:6px 10px" @click="setToToday()">Today</button>
                    </div>
                    <div style="display:flex;gap:8px">
                        <button class="save-btn" style="flex:1" @click="navPrev()">◀ Prev</button>
                        <button class="save-btn" style="flex:1" @click="navNext()">Next ▶</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <h4>Wage Rules Configuration</h4>
                <div style="display:flex;flex-direction:column;gap:8px">
                    <label class="small muted">Base Hourly Rate ($)</label>
                    <input class="input-num" style="width:100%; text-align:left;" type="number" step="0.01" x-model.number="baseRate" @change="calculatePayroll()" />
                    <label class="small muted">Incentive / Bonus Pay Out ($)</label>
                    <input class="input-num" style="width:100%; text-align:left;" type="number" step="0.01" x-model.number="incentiveAmt" @change="calculatePayroll()" />
                </div>
            </div>
            <div class="card">
                <h4>Sandbox Persistence</h4>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="ghost" style="flex:1" @click="saveState()">Save State</button>
                    <button class="ghost" style="flex:1" @click="loadState()">Load State</button>
                    <button class="ghost" @click="clearPersistedState()">Clear</button>
                </div>
            </div>
        </div>
        <div class="sidebar-backdrop" :class="sidebarOpen && 'show'" @click="sidebarOpen = false"></div>

        <div class="sheet" :class="sheetOpen && 'open'">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                    <h3 x-text="selectedDay?.dateShort + ' — Configuration Block'" style="margin:0"></h3>
                    <div class="muted small" x-text="selectedDay?.label"></div>
                </div>
                <button class="ghost" @click="sheetOpen = false">Close</button>
            </div>
            <div style="margin-top:16px">
                <label class="small muted" style="display:block; margin-bottom:6px;">Leave Allocation Type</label>
                <select class="input-num" style="width:100%; text-align:left;" x-model="selectedDayLeaveType">
                    <option value="">No Time-Off Planned</option>
                    <option value="Regular PTO">Regular PTO</option>
                    <option value="Emergency PTO">Emergency PTO</option>
                    <option value="Holiday Leave Taken">Holiday Leave Taken</option>
                </select>
                <template x-if="selectedDay && !selectedDay.isDefaultWorkDay">
                    <div style="margin-top:16px">
                        <label class="small muted">Weekend System Coverage</label>
                        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
                            <input type="checkbox" x-model="selectedDayCoverage" id="cov" />
                            <label for="cov" class="small muted" x-text="selectedDayCoverage ? 'Active Coverage (1.5x Premium Overtime Factor)' : 'No Coverage'"></label>
                        </div>
                    </div>
                </template>
                <div style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
                    <button class="ghost" @click="sheetOpen = false">Cancel</button>
                    <button class="save-btn" @click="commitDay()">Commit Rules</button>
                </div>
            </div>
        </div>

        <div class="bottom-tabs">
            <div class="tab-btn" :class="tab === 'time' && 'active'" @click="tab = 'time'">
                <span>⏱</span><span>Time</span>
            </div>
            <div class="tab-btn" :class="tab === 'calendar' && 'active'" @click="tab = 'calendar'">
                <span>📅</span><span>Cal</span>
            </div>
            <div class="tab-btn" :class="tab === 'deductions' && 'active'" @click="tab = 'deductions'">
                <span>➖</span><span>Deduct</span>
            </div>
            <div class="tab-btn" :class="tab === 'tax' && 'active'" @click="tab = 'tax'">
                <span>💸</span><span>Tax</span>
            </div>
            <div class="tab-btn" :class="tab === 'debug' && 'active'" @click="tab = 'debug'">
                <span>🛠</span><span>Debug</span>
            </div>
        </div>
    </div>

    <script>
        function payrollApp() {
            const toISO = (d) => {
                try {
                    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
                } catch (e) {
                    return new Date().toISOString().slice(0, 10);
                }
            };

            return {
                tab: 'time',
                sidebarOpen: false,
                sheetOpen: false,
                selectedDay: null,
                selectedDayLeaveType: '',
                selectedDayCoverage: false,
                startDateInput: new Date().toISOString().slice(0, 10),
                
                baseRate: 41.64,
                incentiveAmt: 0,
                enableFedWithholding: true,
                
                currentYear: new Date().getFullYear(),
                currentMonth: new Date().getMonth(),
                
                preTax: { med: 0, dental: 0, k401: 0 },
                postTax: { roth: 0 },
                scheduledLeaveLog: [],
                timecardDays: [],
                
                payroll: {
                    earnings: 0,
                    net: 0,
                    taxableGross: 0,
                    preTaxTotal: 0,
                    postTaxTotal: 0,
                    taxes: { federal: 0, ss: 0, med: 0, state: 0 },
                    taxesTotal: 0
                },

                get calendarBlanks() {
                    const first = new Date(this.currentYear, this.currentMonth, 1);
                    return Array(first.getDay()).fill(0);
                },

                get calendarDays() {
                    const days = [];
                    const daysInMonth = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                    for (let d = 1; d <= daysInMonth; d++) {
                        const date = new Date(this.currentYear, this.currentMonth, d);
                        const iso = toISO(date);
                        const log = this.scheduledLeaveLog.find(l => l.date === iso);
                        const isDefaultWorkDay = [1, 2, 3, 4, 5].includes(date.getDay());
                        const leaveType = log?.leaveType || '';
                        const shiftCoverage = !!log?.shiftCoverage;
                        let payMultiplier = isDefaultWorkDay ? 1 : 0;
                        if (leaveType) payMultiplier = 1;
                        if (shiftCoverage) payMultiplier *= 1.5;
                        const estGross = 333.12 * payMultiplier;
                        
                        days.push({
                            iso, date, dayNum: d, isDefaultWorkDay,
                            leaveType, shiftCoverage, estGross
                        });
                    }
                    return days;
                },

                get monthLabel() {
                    return new Date(this.currentYear, this.currentMonth).toLocaleString(undefined, { month: 'long', year: 'numeric' });
                },

                get periodLabel() {
                    if (!this.timecardDays.length) return '—';
                    return this.timecardDays[0].dateShort + ' — ' + this.timecardDays[13]?.dateShort;
                },

                get leaveHours() {
                    return this.calendarDays.reduce((sum, d) => d.leaveType ? sum + 12 : sum, 0);
                },

                get preTaxTotal() {
                    return Object.values(this.preTax).reduce((a, b) => a + Number(b), 0);
                },

                get postTaxTotal() {
                    return Object.values(this.postTax).reduce((a, b) => a + Number(b), 0);
                },

                init() {
                    this.buildTimecard(new Date());
                    this.calculatePayroll();
                    const saved = localStorage.getItem('payroll_state_alpine');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            Object.assign(this, data);
                        } catch (e) {}
                    }
                },

                buildTimecard(startDate) {
                    this.timecardDays = [];
                    for (let i = 0; i < 14; i++) {
                        const d = new Date(startDate);
                        d.setDate(startDate.getDate() + i);
                        const iso = toISO(d);
                        const label = d.toLocaleString('en-US', { weekday: 'short' });
                        const dateShort = d.toLocaleString('en-US', { month: 'numeric', day: 'numeric' });
                        const isDefaultWorkDay = !['Sat', 'Sun'].includes(label);
                        
                        this.timecardDays.push({
                            iso, date: d, label, dateShort, isDefaultWorkDay,
                            reg: isDefaultWorkDay ? 12 : 0,
                            ot: 0,
                            dt: 0,
                            eptoChecked: false
                        });
                    }
                },

                calculatePayroll() {
                    const days = this.timecardDays;
                    let w1Reg = 0, w1OT = 0, w2Reg = 0, w2OT = 0, dtHrs = 0;
                    let w1CumulativeReg = 0, w2CumulativeReg = 0;

                    days.forEach((d, i) => {
                        const inputReg = Number(d.reg || 0);
                        const inputOt = Number(d.ot || 0);
                        const inputDt = Number(d.dt || 0);

                        if (d.label === 'Sun') {
                            dtHrs += inputDt;
                        } else if (i < 7) {
                            const allowed = Math.max(0, 40 - w1CumulativeReg);
                            if (w1CumulativeReg + inputReg > 40) {
                                w1Reg += allowed;
                                w1OT += (inputReg - allowed) + inputOt;
                                w1CumulativeReg += allowed;
                            } else {
                                w1Reg += inputReg;
                                w1OT += inputOt;
                                w1CumulativeReg += inputReg;
                            }
                        } else {
                            const allowed = Math.max(0, 40 - w2CumulativeReg);
                            if (w2CumulativeReg + inputReg > 40) {
                                w2Reg += allowed;
                                w2OT += (inputReg - allowed) + inputOt;
                                w2CumulativeReg += allowed;
                            } else {
                                w2Reg += inputReg;
                                w2OT += inputOt;
                                w2CumulativeReg += inputReg;
                            }
                        }
                    });

                    const w1GrossNoOT = w1Reg * this.baseRate;
                    const w2GrossNoOT = w2Reg * this.baseRate;
                    const w1OTPay = w1OT * (this.baseRate * 1.5);
                    const w2RegGross = w2GrossNoOT + this.incentiveAmt;
                    const totalW2ActiveHours = w2Reg + w2OT;
                    const w2OTRate = totalW2ActiveHours > 0 ? (w2RegGross / totalW2ActiveHours) * 1.5 : this.baseRate * 1.5;
                    const w2OTPay = w2OT * w2OTRate;
                    const dtPay = dtHrs * this.baseRate * 2.0;

                    const earnings = w1GrossNoOT + w2GrossNoOT + w1OTPay + w2OTPay + dtPay + this.incentiveAmt;
                    const preTaxTotal = this.preTaxTotal;
                    const postTaxTotal = this.postTaxTotal;
                    const taxableGross = Math.max(0, earnings - preTaxTotal);

                    const taxes = {
                        ss: taxableGross * 0.062,
                        med: taxableGross * 0.0145,
                        state: taxableGross * 0.0499,
                        federal: this.enableFedWithholding ? taxableGross * 0.082 : 0
                    };

                    const taxesTotal = taxes.ss + taxes.med + taxes.state + taxes.federal;
                    const net = Math.max(0, earnings - preTaxTotal - taxesTotal - postTaxTotal);

                    this.payroll = { earnings, net, taxableGross, preTaxTotal, postTaxTotal, taxes, taxesTotal };
                },

                autoFillFromCalendar() {
                    this.timecardDays.forEach(td => {
                        const calDay = this.calendarDays.find(d => d.iso === td.iso);
                        td.reg = calDay && calDay.isDefaultWorkDay ? 12 : 0;
                        td.ot = 0;
                        td.dt = 0;
                        td.eptoChecked = false;
                    });
                    this.calculatePayroll();
                },

                clearTimecard() {
                    this.timecardDays.forEach(td => {
                        td.reg = 0; td.ot = 0; td.dt = 0; td.eptoChecked = false;
                    });
                    this.calculatePayroll();
                },

                openDaySheet(day) {
                    this.selectedDay = day;
                    const log = this.scheduledLeaveLog.find(l => l.date === day.iso);
                    this.selectedDayLeaveType = log?.leaveType || '';
                    this.selectedDayCoverage = !!log?.shiftCoverage;
                    this.sheetOpen = true;
                },

                commitDay() {
                    if (!this.selectedDay) return;
                    this.scheduledLeaveLog = this.scheduledLeaveLog.filter(l => l.date !== this.selectedDay.iso);
                    if (this.selectedDayLeaveType || this.selectedDayCoverage) {
                        this.scheduledLeaveLog.push({
                            date: this.selectedDay.iso,
                            leaveType: this.selectedDayLeaveType,
                            shiftCoverage: this.selectedDayCoverage,
                            hours: 12
                        });
                    }
                    this.sheetOpen = false;
                    this.selectedDay = null;
                    this.calculatePayroll();
                },

                prevMonth() { this.currentMonth--; if (this.currentMonth < 0) { this.currentMonth = 11; this.currentYear--; } },
                nextMonth() { this.currentMonth++; if (this.currentMonth > 11) { this.currentMonth = 0; this.currentYear++; } },

                navPrev() { const d = new Date(this.timecardDays[0]?.date || new Date()); d.setDate(d.getDate() - 14); this.buildTimecard(d); this.calculatePayroll(); },
                navNext() { const d = new Date(this.timecardDays[0]?.date || new Date()); d.setDate(d.getDate() + 14); this.buildTimecard(d); this.calculatePayroll(); },

                applyStart() { if (this.startDateInput) { this.buildTimecard(new Date(this.startDateInput + 'T00:00:00')); this.calculatePayroll(); this.sidebarOpen = false; } },
                setToThisMonth() { const d = new Date(); d.setDate(1); this.startDateInput = d.toISOString().slice(0, 10); },
                setToToday() { this.startDateInput = new Date().toISOString().slice(0, 10); },
                setToPrevPeriod() { const d = new Date(this.timecardDays[0]?.date || new Date()); d.setDate(d.getDate() - 14); this.startDateInput = d.toISOString().slice(0, 10); },

                saveState() {
                    localStorage.setItem('payroll_state_alpine', JSON.stringify({
                        preTax: this.preTax,
                        postTax: this.postTax,
                        baseRate: this.baseRate,
                        incentiveAmt: this.incentiveAmt,
                        scheduledLeaveLog: this.scheduledLeaveLog
                    }));
                    alert('State Saved.');
                },

                loadState() {
                    const saved = localStorage.getItem('payroll_state_alpine');
                    if (!saved) return alert('No saved state found.');
                    try {
                        const data = JSON.parse(saved);
                        this.preTax = data.preTax;
                        this.postTax = data.postTax;
                        this.baseRate = data.baseRate;
                        this.incentiveAmt = data.incentiveAmt;
                        this.scheduledLeaveLog = data.scheduledLeaveLog;
                        this.calculatePayroll();
                        alert('State Loaded.');
                    } catch (e) { alert('Load failed.'); }
                },

                clearPersistedState() {
                    if (confirm('Clear local system persistence frames?')) {
                        localStorage.removeItem('payroll_state_alpine');
                        alert('State Cleared.');
                    }
                }
            };
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('payrollApp', payrollApp);
        });
    </script>
</body>
</html>
